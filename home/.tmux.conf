# Remap prefix from Ctrl+b to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vi copy mode
set -g mode-keys vi
set -g status off
set -g mouse on

# Enter copy mode with prefix + Enter
bind Enter copy-mode

# Vi-style selection and yank
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel

# h/j/k/l movement (already default in vi mode, but explicit)
bind -T copy-mode-vi h send -X cursor-left
bind -T copy-mode-vi j send -X cursor-down
bind -T copy-mode-vi k send -X cursor-up
bind -T copy-mode-vi l send -X cursor-right

# w/b/e word movement
bind -T copy-mode-vi w send -X next-word
bind -T copy-mode-vi b send -X previous-word
bind -T copy-mode-vi e send -X next-word-end

# G/g for top/bottom
bind -T copy-mode-vi g send -X history-top
bind -T copy-mode-vi G send -X history-bottom

# Kill tmp session automatically
set-hook -g client-detached 'run-shell "
  if [ \"#{session_environment:TMUX_EPHEMERAL}\" = \"1\" ]; then
    tmux kill-session -t #{session_name}
  fi
"'

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Initialize tpm (must be last line)
run '~/.tmux/plugins/tmux-which-key/plugin.sh.tmux'
run '~/.tmux/plugins/tpm/tpm'
